<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">Leo Teixeira — Engenharia de IA aplicada a produtos</title>
  <desc id="desc">Monograma LT e órbitas sutis nas cores do portfólio de Leo Teixeira.</desc>
  <defs>
    <radialGradient id="ambient" cx="92%" cy="50%" r="68%">
      <stop offset="0" stop-color="#C7B7A3" stop-opacity=".12"/>
      <stop offset=".45" stop-color="#C7B7A3" stop-opacity=".035"/>
      <stop offset="1" stop-color="#0B0C0E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="micro-grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#F2F1ED" stroke-opacity=".022" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="240" fill="#0B0C0E"/>
  <rect width="1200" height="240" fill="url(#ambient)"/>
  <rect width="1200" height="240" fill="url(#micro-grid)"/>

  <!-- Official two-tone LT monogram from the portfolio favicon. -->
  <rect x="58" y="64" width="112" height="112" rx="20" fill="#15171A" stroke="#F2F1ED" stroke-opacity=".14"/>
  <g transform="translate(58 64) scale(1.75)">
    <path d="M13 13h10v29h17v9H13V13Z" fill="#F2F1ED"/>
    <path d="M27 13h29v9h-10v29H35V22H27v-9Z" fill="#C7B7A3"/>
  </g>

  <path d="M202 64v112" fill="none" stroke="#C7B7A3" stroke-opacity=".82" stroke-width="1.5"/>
  <circle cx="202" cy="176" r="3.2" fill="#8FB7A1"/>

  <text x="238" y="81" fill="#C7B7A3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" letter-spacing="2.1">ENGENHARIA DE IA APLICADA A PRODUTOS</text>
  <text x="236" y="137" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" letter-spacing="-.9">
    <tspan fill="#F2F1ED">LEO </tspan><tspan fill="#C7B7A3">TEIXEIRA</tspan>
  </text>
  <text x="238" y="173" fill="#B2B5B9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" letter-spacing=".35">Construir / Liderar / Compartilhar</text>

  <!-- Quiet orbital paths echo the real portfolio artwork. -->
  <g fill="none" stroke-linecap="round">
    <path d="M745 182C829 44 1012 5 1200 52" stroke="#C7B7A3" stroke-opacity=".26" stroke-width="1.1"/>
    <path d="M785 223C912 83 1046 39 1200 86" stroke="#AABBD4" stroke-opacity=".19" stroke-width="1.1"/>
    <path d="M811 19C930 61 1043 156 1200 189" stroke="#C7B7A3" stroke-opacity=".2" stroke-width="1.05"/>
    <path d="M823 151C943 222 1086 232 1200 211" stroke="#C7B7A3" stroke-opacity=".19" stroke-width="1" stroke-dasharray="2 7"/>
    <ellipse cx="1188" cy="119" rx="161" ry="54" transform="rotate(-13 1188 119)" stroke="#C7B7A3" stroke-opacity=".18" stroke-width="1"/>
    <ellipse cx="1188" cy="119" rx="111" ry="36" transform="rotate(-13 1188 119)" stroke="#8FB7A1" stroke-opacity=".16" stroke-width="1"/>
    <path d="M846 120h354M1040 0v240" stroke="#F2F1ED" stroke-opacity=".055" stroke-width="1"/>
  </g>
  <circle cx="917" cy="48" r="3.4" fill="#AABBD4"/>
  <circle cx="1006" cy="190" r="3.6" fill="#8FB7A1"/>
  <circle cx="1108" cy="61" r="3.1" fill="#C7B7A3"/>
  <circle cx="1169" cy="130" r="4.2" fill="#F2F1ED"/>
</svg>
